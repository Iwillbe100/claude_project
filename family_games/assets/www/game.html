<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
@font-face { font-family: "Jua"; src: url("Jua-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Gowun Dodum"; src: url("GowunDodum-Regular.ttf") format("truetype"); font-display: swap; }
[hidden] { display: none !important; }
body { margin: 0; user-select: none; -webkit-user-select: none; }
img { max-width: 100%; }

<title>가족여행 게임판</title>
<style>
/* Layout: one-screen phone app. Home = 2-column tile board, each game = full-height stage passed hand to hand. */
:root {
  --bg: #EAF2F4;
  --surface: #FFFFFF;
  --ink: #16313B;
  --muted: #587480;
  --line: #CFDEE3;
  --g-finger: #E9573A;
  --g-bomb: #23343C;
  --g-liar: #6A4BD1;
  --g-head: #F5A623;
  --g-balance: #0F8A87;
  --g-chosung: #2F6FD6;
  --g-quiz: #D2457A;
  --g-nonsense: #5E8F1E;
  --on: #FFFFFF;
  --on-sun: #16313B;
  --good: #19A463;
  --bad: #D9483B;
  --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1C22; --surface: #16292F; --ink: #E7F0F2; --muted: #91A9B2; --line: #284149;
    --g-finger: #F06A4D; --g-bomb: #3A5662; --g-liar: #7E62E3; --g-head: #F7B23E; --g-balance: #19A19D; --g-chosung: #4A86E8; --g-quiz: #E2638F; --g-nonsense: #7DB236;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1C22; --surface: #16292F; --ink: #E7F0F2; --muted: #91A9B2; --line: #284149;
  --g-finger: #F06A4D; --g-bomb: #3A5662; --g-liar: #7E62E3; --g-head: #F7B23E; --g-balance: #19A19D; --g-chosung: #4A86E8; --g-quiz: #E2638F; --g-nonsense: #7DB236;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 18px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 560px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; gap: 16px; padding-block: 16px;
}
h1, h2, h3, .display { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--g-chosung); outline-offset: 2px; }

/* Home */
.hero { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.hero h1 { font-size: 2.3rem; line-height: 1.1; }
.eyebrow { font-size: .85rem; letter-spacing: .08em; color: var(--muted); }
.crew { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip-name { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: .95rem; }
.chip-name.baby { border-style: dashed; color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--g-chosung); text-decoration: underline; padding: 4px; font-size: .95rem; }
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile {
  border: 0; border-radius: 22px; padding: 16px; text-align: left;
  display: flex; flex-direction: column; gap: 6px; min-height: 150px;
  color: var(--on); background: var(--tile);
  transition: transform .12s;
}
.tile:active { transform: scale(.97); }
.tile .mark { font-family: var(--display); font-size: 2.1rem; line-height: 1; margin-bottom: auto; opacity: .95; }
.tile .name { font-family: var(--display); font-size: 1.35rem; line-height: 1.2; }
.tile .desc { font-size: .85rem; line-height: 1.35; opacity: .9; }
.tile.sun { color: var(--on-sun); }

/* Common game chrome */
.top { display: flex; align-items: center; gap: 10px; }
.top h2 { font-size: 1.5rem; flex: 1; min-width: 0; }
.back {
  width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); font-size: 1.4rem; line-height: 1; flex: none;
}
.rule { color: var(--muted); font-size: 1rem; }
.btn {
  min-height: 60px; border-radius: 18px; border: 0; padding: 10px 18px;
  font-family: var(--display); font-size: 1.35rem;
  background: var(--accent, var(--ink)); color: var(--on); width: 100%;
}
.btn.sun { color: var(--on-sun); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.card {
  background: var(--surface); border-radius: 24px; padding: 24px 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 12px;
}
.stage { flex: 1; display: flex; flex-direction: column; gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 8px 16px; font-size: 1.05rem; min-height: 44px;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on); border-color: transparent; }
.chip.sun[aria-pressed="true"] { color: var(--on-sun); }
.label { font-size: .85rem; letter-spacing: .06em; color: var(--muted); }
.big { font-family: var(--display); font-size: clamp(2.6rem, 13vw, 4.4rem); line-height: 1.1; word-break: keep-all; }
.mid { font-family: var(--display); font-size: 1.7rem; line-height: 1.25; word-break: keep-all; }
.penalty { font-family: var(--display); font-size: 1.5rem; color: var(--accent); }

/* Finger picker */
.pad {
  position: relative; flex: 1; min-height: 58vh; border-radius: 26px; overflow: hidden;
  background: var(--surface); border: 2px dashed var(--line);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.pad .hint { color: var(--muted); font-family: var(--display); font-size: 1.4rem; padding: 20px; pointer-events: none; }
.dot {
  position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%;
  background: var(--c); pointer-events: none;
  box-shadow: 0 0 0 0 var(--c); animation: breathe 1s ease-in-out infinite;
  transition: transform .35s, opacity .35s;
}
.dot.win { transform: scale(1.9); animation: none; box-shadow: 0 0 0 14px color-mix(in srgb, var(--c) 35%, transparent); z-index: 2; }
.dot.out { opacity: .12; transform: scale(.6); animation: none; }
@keyframes breathe { 50% { transform: scale(1.12); } }

/* Bomb */
.bomb {
  width: min(62vw, 250px); aspect-ratio: 1; max-width: 100%; border-radius: 50%;
  background: var(--g-bomb); color: var(--on); display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 2.2rem; position: relative;
}
.bomb::before { content: ""; position: absolute; top: -18px; left: 58%; width: 8px; height: 30px; border-radius: 4px; background: var(--g-head); transform: rotate(25deg); }
.bomb.tick { animation: jolt .12s; }
@keyframes jolt { 50% { transform: scale(1.06) rotate(-3deg); } }
.boom { background: var(--g-finger); color: var(--on); }
.boom .penalty { color: var(--on); }

/* Forehead quiz */
.headstage { position: relative; flex: 1; min-height: 60vh; border-radius: 26px; background: var(--g-head); color: var(--on-sun); overflow: hidden; }
.headstage .word { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; font-family: var(--display); font-size: clamp(3rem, 16vw, 6rem); line-height: 1.1; word-break: keep-all; pointer-events: none; }
.headstage .side { position: absolute; top: 0; bottom: 0; width: 50%; border: 0; background: transparent; display: flex; align-items: flex-end; padding: 16px; font-family: var(--display); font-size: 1.3rem; color: var(--on-sun); }
.headstage .side.l { left: 0; justify-content: flex-start; }
.headstage .side.r { right: 0; justify-content: flex-end; }
.headstage.flash-ok { background: var(--good); }
.headstage.flash-pass { background: var(--bad); }
.timer { font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.reslist { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.reslist li { border-radius: 999px; padding: 4px 12px; font-size: 1rem; background: var(--bg); }
.reslist li.ok { background: var(--good); color: var(--on); }

/* Balance */
.vs { display: grid; grid-template-rows: 1fr auto 1fr; gap: 0; flex: 1; min-height: 52vh; }
.side-btn {
  border: 0; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--display); font-size: clamp(1.6rem, 7vw, 2.2rem); line-height: 1.25; word-break: keep-all; color: var(--on);
}
.side-btn.a { background: var(--g-balance); }
.side-btn.b { background: var(--g-finger); }
.side-btn .cnt { font-size: 1rem; font-family: var(--body); background: color-mix(in srgb, var(--on) 22%, transparent); border-radius: 999px; padding: 2px 12px; font-variant-numeric: tabular-nums; }
.vs .mid-vs { justify-self: center; font-family: var(--display); font-size: 1.4rem; margin: -14px 0; z-index: 1; background: var(--bg); border-radius: 999px; padding: 4px 14px; }

/* Chosung */
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; width: 100%; }
.bar i { display: block; height: 100%; background: var(--accent); transform-origin: left; animation: drain linear forwards; }
@keyframes drain { to { transform: scaleX(0); } }
.cho { font-family: var(--display); font-size: clamp(3.4rem, 18vw, 6rem); letter-spacing: .12em; line-height: 1.1; }

.tile.wide { grid-column: 1 / -1; min-height: 120px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt {
  min-height: 72px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface);
  font-family: var(--display); font-size: 1.25rem; line-height: 1.25; padding: 10px; word-break: keep-all;
}
.opt.right { background: var(--good); border-color: var(--good); color: var(--on); }
.opt.wrong { background: var(--bad); border-color: var(--bad); color: var(--on); }
#score b { font-variant-numeric: tabular-nums; margin-left: 4px; }

/* Players */
.plist { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; gap: 8px; }
.prow input { flex: 1; min-width: 0; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 14px; font: inherit; }
.prow button { width: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 1.3rem; }
.order { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.order span { background: var(--bg); border-radius: 999px; padding: 4px 12px; font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .bar i { animation-duration: var(--dur) !important; }
}
</style>

</head>

let ac;
function audio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch (e) {} return ac; }
function beep(freq, dur = .08, type = "square", vol = .12) {
  const a = audio(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  } catch (e) {}
}
function boom() {
  const a = audio(); if (!a) return;
  try {
    const len = Math.floor(a.sampleRate * 1.1), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = 900; g.gain.value = .9;
    src.buffer = buf; src.connect(f).connect(g).connect(a.destination); src.start();
  } catch (e) {}
}
const buzz = p => { try { if (window.Haptic) Haptic.postMessage(JSON.stringify(p)); else if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

/* 1. Finger picker */
function finger() {
  render(`${topBar("손가락 뽑기")}
    <p class="rule">뽑힐 사람 모두 화면에 손가락 하나씩 올리고 가만히 기다리세요.</p>
    <div class="pad" id="pad"><p class="hint" id="hint">여기에 손가락을<br>올려 주세요</p></div>
    <div id="after" hidden class="card" style="--accent: var(--g-finger)">
      <p class="label">당첨자 벌칙</p><p class="penalty" id="pen"></p>
      <div class="row" style="width:100%"><button class="btn ghost" id="rePen">다른 벌칙</button><button class="btn" id="again">다시 하기</button></div>
    </div>`, "--g-finger");
  const pad = $("#pad"), hint = $("#hint");
  const colors = NEXT_TINTS;
  const touches = new Map();
  let picked = false, pickT = null;
  const setHint = t => { hint.innerHTML = t; hint.hidden = !t; };
  const reset = () => {
    picked = false; touches.forEach(t => t.el.remove()); touches.clear(); $$(".dot").forEach(d => d.remove());
    $("#after").hidden = true; setHint("여기에 손가락을<br>올려 주세요");
  };
  const schedule = () => {
    clearTimeout(pickT);
    if (picked) return;
    if (touches.size === 0) setHint("여기에 손가락을<br>올려 주세요");
    else if (touches.size === 1) setHint("");
    else setHint("");
    if (touches.size >= 2) pickT = setTimeout(choose, 2600);
  };
  const choose = () => {
    const all = [...touches.values()];
    if (all.length < 2) return;
    picked = true;
    const w = pick(all);
    all.forEach(t => t.el.classList.add(t === w ? "win" : "out"));
    beep(660, .12, "triangle", .2); later(() => beep(990, .25, "triangle", .2), 120);
    buzz([80, 40, 200]);
    $("#pen").textContent = pick(PENALTIES);
    $("#after").hidden = false;
  };
  const place = (t, e) => { const r = pad.getBoundingClientRect(); t.el.style.left = (e.clientX - r.left) + "px"; t.el.style.top = (e.clientY - r.top) + "px"; };
  const down = e => {
    e.preventDefault();
    if (picked) { if (touches.size === 0) reset(); else return; }
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    const el = document.createElement("div");
    el.className = "dot";
    el.style.setProperty("--c", `var(${colors[touches.size % colors.length]})`);
    const t = { el }; touches.set(e.pointerId, t); place(t, e); pad.appendChild(el);
    beep(440 + touches.size * 80, .06, "sine", .1);
    schedule();
  };
  const move = e => { const t = touches.get(e.pointerId); if (t && !picked) place(t, e); };
  const up = e => {
    const t = touches.get(e.pointerId); if (!t) return;
    touches.delete(e.pointerId);
    if (!picked) { t.el.remove(); schedule(); }
  };
  pad.addEventListener("pointerdown", down);
  pad.addEventListener("pointermove", move);
  pad.addEventListener("pointerup", up);
  pad.addEventListener("pointercancel", up);
  pad.addEventListener("contextmenu", e => e.preventDefault());
  $("#rePen").onclick = () => $("#pen").textContent = pick(PENALTIES);
  $("#again").onclick = reset;
  cleanup = () => clearTimeout(pickT);
}

function headPlay() {

  const mark = ok => {
    if (!live) return;
    res.push({ w: words[idx], ok }); idx++;
    st.classList.add(ok ? "flash-ok" : "flash-pass");
    ok ? beep(880, .12, "triangle", .2) : beep(220, .15, "sawtooth", .12);
    buzz(ok ? 60 : [30, 30, 30]);
    later(() => st.classList.remove("flash-ok", "flash-pass"), 220);
    show();
  };
  $("#ok").onclick = () => mark(true);
  $("#pass").onclick = () => mark(false);
  const count = n => {
    if (n === 0) { live = true; beep(988, .2); show(); return later(clock, 1000); }
    w.textContent = n; beep(660, .1); later(() => count(n - 1), 1000);
  };
  const clock = () => {
    left--; t.textContent = left;
    if (left <= 5 && left > 0) beep(1200, .05);
    if (left <= 0) return finish();
    later(clock, 1000);
  };
  const finish = () => {
    live = false; boom(); buzz(300);
    const score = res.filter(r => r.ok).length;
    render(`${topBar("이마 퀴즈")}
      <div class="card stage"><p class="label">맞힌 개수</p><p class="big">${score}개</p>
        <ul class="reslist">${res.map(r => `<li class="${r.ok ? "ok" : ""}">${esc(r.w)}</li>`).join("") || "<li>하나도 못 봤어요</li>"}</ul></div>
      <div class="row"><button class="btn ghost" id="setup">주제 바꾸기</button><button class="btn sun" id="again">다음 사람</button></div>`, "--g-head");
    $("#setup").onclick = headSetup;
    $("#again").onclick = headPlay;
  };
  count(3);
}

/* 5. Balance */
function balance() {
  const qs = shuffle(BALANCE);
  let i = 0;
  const draw = () => {
    const [a, b] = qs[i % qs.length];
    const cnt = { a: 0, b: 0 };
    render(`${topBar("밸런스 게임")}
      <p class="rule">"하나, 둘, 셋!"에 동시에 손을 드세요. 손 든 사람 수만큼 눌러서 세어도 돼요.</p>
      <div class="vs">
        <button class="side-btn a" id="a">${esc(a)}<span class="cnt" id="ca">0명</span></button>
        <span class="mid-vs">VS</span>
        <button class="side-btn b" id="b">${esc(b)}<span class="cnt" id="cb">0명</span></button>
      </div>
      <div class="row"><button class="btn ghost" id="zero">숫자 지우기</button><button class="btn" id="next">다음 질문 (${(i % qs.length) + 1}/${qs.length})</button></div>`, "--g-balance");
    $("#a").onclick = () => { cnt.a++; $("#ca").textContent = cnt.a + "명"; beep(600, .05, "sine"); };
    $("#b").onclick = () => { cnt.b++; $("#cb").textContent = cnt.b + "명"; beep(500, .05, "sine"); };
    $("#zero").onclick = () => { cnt.a = cnt.b = 0; $("#ca").textContent = "0명"; $("#cb").textContent = "0명"; };
    $("#next").onclick = () => { i++; draw(); };
  };
  draw();
}

/* 7. General knowledge quiz */
function quiz() {
  const qs = shuffle(QUIZ);
  const score = Object.fromEntries(players.map(p => [p, 0]));
  let i = 0;
  const board = () => players.map(p => `<button class="chip" data-p="${esc(p)}">${esc(p)} <b>${score[p]}</b></button>`).join("");
  const draw = () => {
    const [q, ans, ...wrong] = qs[i % qs.length];
    const opts = shuffle([ans, ...wrong]);
    render(`${topBar("상식 퀴즈")}
      <div class="card"><p class="label">${(i % qs.length) + 1} / ${qs.length}</p><p class="mid">${esc(q)}</p></div>
      <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
      <p class="label">먼저 맞힌 사람 이름을 눌러 1점</p>
      <div class="chips" id="score">${board()}</div>
      <button class="btn" id="next">다음 문제</button>`, "--g-quiz");
    let done = false;
    $$(".opt").forEach(b => b.onclick = () => {
      if (done) return; done = true;
      const ok = opts[+b.dataset.k] === ans;
      $$(".opt").forEach(x => { if (opts[+x.dataset.k] === ans) x.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      ok ? beep(880, .15, "triangle", .2) : beep(200, .2, "sawtooth", .12);
    });
    const bindScore = () => $$("#score .chip").forEach(c => c.onclick = () => {
      score[c.dataset.p]++; beep(700, .06, "sine"); $("#score").innerHTML = board(); bindScore();
    });
    bindScore();
    $("#next").onclick = () => { i++; draw(); };
  };
  draw();
}

/* 8. Nonsense quiz */
function nonsense() {
  const qs = shuffle(NONSENSE);
  const score = Object.fromEntries(players.map(p => [p, 0]));
  let i = 0;
  const board = () => players.map(p => `<button class="chip" data-p="${esc(p)}">${esc(p)} <b>${score[p]}</b></button>`).join("");
  const draw = () => {
    const [q, ans, why] = qs[i % qs.length];
    render(`${topBar("넌센스 퀴즈")}
      <div class="card stage"><p class="label">${(i % qs.length) + 1} / ${qs.length}</p><p class="mid">${esc(q)}</p>
        <div id="ans" style="visibility:hidden"><p class="big" style="color:var(--g-nonsense)">${esc(ans)}</p>${why ? `<p class="rule">${esc(why)}</p>` : ""}</div></div>
      <p class="label">먼저 맞힌 사람 이름을 눌러 1점</p>
      <div class="chips" id="score">${board()}</div>
      <div class="row"><button class="btn ghost" id="show">정답 보기</button><button class="btn" id="next">다음 문제</button></div>`, "--g-nonsense");
    $("#show").onclick = () => { $("#ans").style.visibility = "visible"; beep(660, .1, "triangle", .2); later(() => beep(990, .2, "triangle", .2), 100); };
    const bindScore = () => $$("#score .chip").forEach(c => c.onclick = () => {
      score[c.dataset.p]++; beep(700, .06, "sine"); $("#score").innerHTML = board(); bindScore();
    });
    bindScore();
    $("#next").onclick = () => { i++; draw(); };
  };
  draw();
}

/* 6. Chosung */
let choCat = "음식";
function chosungSetup() {
  render(`${topBar("초성 퀴즈")}
    <p class="rule">초성만 보고 단어를 먼저 외친 사람이 1점! 15초 안에 아무도 못 맞히면 정답을 확인하고 넘어가요.</p>
    <p class="label">주제 고르기</p>
    ${chipGroup("cats", [...Object.keys(D), "섞어서"], choCat)}
    <button class="btn" id="go">시작</button>`, "--g-chosung");
  bindChips("cats", v => choCat = v);
  $("#go").onclick = chosungPlay;
}
function chosungPlay() {
  const pool = choCat === "섞어서" ? Object.entries(D).flatMap(([c, ws]) => ws.map(w => [c, w])) : D[choCat].map(w => [choCat, w]);
  const qs = shuffle(pool);
  let i = 0;
  const draw = () => {
    const [cat, word] = qs[i % qs.length];
    render(`${topBar("초성 퀴즈")}
      <div class="card stage"><p class="label">주제: ${esc(cat)} · ${(i % qs.length) + 1}번</p>
        <p class="cho">${esc(chosung(word))}</p>
        <div class="bar"><i style="animation-duration:15s;--dur:15s"></i></div>
        <p class="mid" id="ans" style="visibility:hidden">${esc(word)}</p></div>
      <div class="row"><button class="btn ghost" id="show">정답 보기</button><button class="btn" id="next">다음 문제</button></div>`, "--g-chosung");
    const reveal = () => { $("#ans").style.visibility = "visible"; };
    later(() => { beep(330, .3, "triangle", .15); reveal(); }, 15000);
    $("#show").onclick = reveal;
    $("#next").onclick = () => { i++; draw(); };
  };
  draw();
}

// Android back button: go back to the board instead of closing the app.
window.appBack = () => { if (app.querySelector(".board")) return false; home(); return true; };
home();
